<!doctype html><html><head><meta charset="utf-8"><title>Mobile QA · San Gregorio Magno</title><style>body{margin:0;background:#20242b;color:white;font:12px Arial}nav{height:48px;display:flex;gap:12px;align-items:center;padding:8px 20px}button{padding:8px 12px}#holder{margin:8px auto}iframe{border:0;display:block;transform-origin:top left}</style></head><body><nav><span>Mobile viewport QA</span><button id="landscape">Landscape 844 × 390</button><button id="portrait">Portrait 393 × 852</button><button id="small">Portrait 320 × 700</button><button id="lose">Simula perdita WebGL</button><button id="restore">Ripristina WebGL</button><span id="result"></span></nav><div id="holder"><iframe title="Gioco mobile" src="/?mobile=1&amp;luogo=rotonda" allow="fullscreen" allowfullscreen width="844" height="390"></iframe></div><script>const f=document.querySelector('iframe'),h=document.querySelector('#holder');function resize(w,v,s=1){f.width=w;f.height=v;f.style.transform='scale('+s+')';h.style.width=w*s+'px';h.style.height=v*s+'px'}document.querySelector('#landscape').onclick=()=>resize(844,390);document.querySelector('#portrait').onclick=()=>resize(393,852,.88);document.querySelector('#small').onclick=()=>resize(320,700);document.querySelector('#lose').onclick=()=>{f.contentWindow.__SGM.renderer.forceContextLoss();document.querySelector('#result').textContent='Perdita simulata';};document.querySelector('#restore').onclick=()=>{f.contentWindow.__SGM.renderer.forceContextRestore();document.querySelector('#result').textContent='Ripristino richiesto';};resize(844,390);</script></body></html>
